<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | DONI | DEV</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
    <script>(function(){try{var t=localStorage.getItem('doni_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');var a=localStorage.getItem('doni_accent')||'green';document.documentElement.setAttribute('data-accent',a);}catch(e){}})();</script>
    <style>
        .admin-login { max-width: 400px; margin: 100px auto; text-align: center; }
        .admin-login input { width: 100%; padding: 14px; margin: 10px 0; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; }
        .admin-panel { display: none; max-width: 900px; margin: 40px auto; }
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .admin-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .admin-card h3 { margin-bottom: 12px; color: var(--accent-green); }
        .stat-number { font-size: 2.5rem; font-weight: 800; }
        .ban-list { max-height: 200px; overflow-y: auto; }
        .ban-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="admin-login" id="adminLogin">
        <h1>🔒 Admin Access</h1>
        <p style="color: var(--text-muted); margin-bottom: 20px;">Sign in with your admin account.</p>
        <input type="email" id="adminEmail" placeholder="Email" autocomplete="username">
        <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password">
        <button class="custom-btn green" onclick="doAdminSignIn()" style="width: 100%; margin-top: 10px;">Sign In</button>
        <p id="loginError" style="color: #ff5555; margin-top: 10px; font-size: 0.85rem;"></p>
    </div>

    <div class="admin-panel" id="adminPanel">
        <header style="margin-bottom: 30px;">
            <a href="index.html" class="logo"><span>DONI</span><span class="logo-badge">ADMIN</span></a>
        </header>

        <div class="admin-grid">
            <div class="admin-card">
                <h3>📊 Site Stats</h3>
                <div class="stat-number" id="adminVisitorCount">—</div>
                <div style="color: var(--text-muted); font-size: 0.85rem;">Active visitors</div>
            </div>

            <div class="admin-card">
                <h3>📢 Announcement</h3>
                <input type="text" id="announceText" placeholder="Type announcement..." style="width: 100%; padding: 10px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; margin-bottom: 10px;">
                <button class="custom-btn green" onclick="postAnnouncement()" style="width: 100%;">Post to Site</button>
                <button class="custom-btn" onclick="clearAnnouncement()" style="width: 100%; margin-top: 8px;">Clear</button>
            </div>

            <div class="admin-card">
                <h3>🚫 Ban / Mute a Session</h3>
                <input type="text" id="modSessionId" placeholder="Session ID..." style="width: 100%; padding: 10px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; margin-bottom: 10px; font-family: monospace; font-size: 0.8rem;">
                <div style="display: flex; gap: 8px;">
                    <button class="custom-btn red" onclick="banSession()" style="flex: 1;">Ban</button>
                    <button class="custom-btn" onclick="muteSession()" style="flex: 1;">Mute</button>
                </div>
            </div>

            <div class="admin-card">
                <h3>🚫 Banned Sessions</h3>
                <div class="ban-list" id="banList">
                    <div style="color: var(--text-muted); font-size: 0.85rem;">Loading…</div>
                </div>
            </div>

            <div class="admin-card">
                <h3>🔇 Muted Sessions</h3>
                <div class="ban-list" id="muteList">
                    <div style="color: var(--text-muted); font-size: 0.85rem;">Loading…</div>
                </div>
            </div>

            <div class="admin-card" style="grid-column: 1 / -1;">
                <h3>🚩 Reported Messages</h3>
                <div class="ban-list" id="reportsList" style="max-height: 320px;">
                    <div style="color: var(--text-muted); font-size: 0.85rem;">Loading…</div>
                </div>
            </div>

            <div class="admin-card">
                <h3>⚡ Quick Actions</h3>
                <button class="custom-btn" onclick="clearChat()" style="width: 100%; margin-bottom: 8px;">Clear Chat History</button>
                <button class="custom-btn" onclick="resetBadges()" style="width: 100%; margin-bottom: 8px;">Reset All Badges</button>
                <button class="custom-btn red" onclick="logoutAdmin()" style="width: 100%;">Logout</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script>
        const ADMIN_EMAIL = 'doni@admin.com';
        const firebaseConfig = {
            apiKey: "AIzaSyBH3qWCy9jRT2HOrX8smaQA1XI5IUVtZlg",
            authDomain: "aboutme-8a339.firebaseapp.com",
            projectId: "aboutme-8a339",
            storageBucket: "aboutme-8a339.firebasestorage.app",
            messagingSenderId: "638307646276",
            appId: "1:638307646276:web:fe52c653fd16fa81f37511",
            measurementId: "G-KHCMH8W9WB"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        let adminIdToken = null;
        let db = null;

        function showPanel(show) {
            document.getElementById('adminLogin').style.display = show ? 'none' : 'block';
            document.getElementById('adminPanel').style.display = show ? 'block' : 'none';
        }

        firebase.auth().onAuthStateChanged(async (user) => {
            if (user && user.email && user.email.toLowerCase() === ADMIN_EMAIL) {
                adminIdToken = await user.getIdToken();
                db = firebase.firestore();
                showPanel(true);
                updateStats();
                loadBannedSessions();
                loadMutedSessions();
                loadReports();
            } else {
                adminIdToken = null;
                showPanel(false);
            }
        });

        async function doAdminSignIn() {
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPass').value;
            const errEl = document.getElementById('loginError');
            errEl.textContent = '';
            try {
                const cred = await firebase.auth().signInWithEmailAndPassword(email, pass);
                if (!cred.user.email || cred.user.email.toLowerCase() !== ADMIN_EMAIL) {
                    await firebase.auth().signOut();
                    errEl.textContent = 'This account is not authorized.';
                }
            } catch (e) {
                errEl.textContent = 'Sign in failed — check email/password.';
            }
        }

        async function updateStats() {
            try {
                const res = await fetch('https://aboutme.donidonka511.workers.dev/visitor-count');
                const data = await res.json();
                document.getElementById('adminVisitorCount').textContent = data.count || 0;
            } catch (e) {}
        }
        setInterval(updateStats, 5000);

        async function postAnnouncement() {
            const text = document.getElementById('announceText').value;
            if (!text || !adminIdToken) return;
            try {
                await fetch('https://aboutme.donidonka511.workers.dev/announce', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminIdToken },
                    body: JSON.stringify({ text: text })
                });
                fetch('https://aboutme.donidonka511.workers.dev/broadcast-notification', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + adminIdToken },
                    body: JSON.stringify({ category: 'announcements', title: 'Announcement', body: text, url: 'index.html' })
                }).catch(() => {}); // best effort — announcement banner already posted regardless
                alert('Announcement posted!');
            } catch (e) { alert('Failed to post.'); }
        }

        async function clearAnnouncement() {
            if (!adminIdToken) return;
            try {
                await fetch('https://aboutme.donidonka511.workers.dev/announce/dismiss', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + adminIdToken }
                });
                alert('Announcement cleared!');
            } catch (e) { alert('Failed to clear.'); }
        }

        function clearChat() {
            if (confirm('Clear all chat messages? This cannot be undone.')) {
                alert('Chat clear requires a Firebase Admin SDK backend function — not wired yet.');
            }
        }

        // ---------- Moderation ----------
        async function banSession(idOverride) {
            const id = (idOverride || document.getElementById('modSessionId').value.trim());
            if (!id) { alert('Enter a session ID first.'); return; }
            try {
                await db.collection('bannedSessions').doc(id).set({
                    bannedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('modSessionId').value = '';
                loadBannedSessions();
            } catch (e) { alert('Ban failed: ' + e.message); }
        }

        async function muteSession(idOverride) {
            const id = (idOverride || document.getElementById('modSessionId').value.trim());
            if (!id) { alert('Enter a session ID first.'); return; }
            try {
                await db.collection('mutedSessions').doc(id).set({
                    mutedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                document.getElementById('modSessionId').value = '';
                loadMutedSessions();
            } catch (e) { alert('Mute failed: ' + e.message); }
        }

        async function unbanSession(id) {
            try { await db.collection('bannedSessions').doc(id).delete(); loadBannedSessions(); }
            catch (e) { alert('Unban failed: ' + e.message); }
        }

        async function unmuteSession(id) {
            try { await db.collection('mutedSessions').doc(id).delete(); loadMutedSessions(); }
            catch (e) { alert('Unmute failed: ' + e.message); }
        }

        async function loadBannedSessions() {
            const el = document.getElementById('banList');
            try {
                const snap = await db.collection('bannedSessions').get();
                if (snap.empty) { el.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">No banned sessions.</div>'; return; }
                el.innerHTML = snap.docs.map(d => `<div class="ban-item"><span style="font-family:monospace;font-size:0.75rem;">${d.id}</span><button onclick="unbanSession('${d.id}')" class="custom-btn" style="padding:4px 10px;font-size:0.75rem;">Unban</button></div>`).join('');
            } catch (e) { el.innerHTML = '<div style="color:#ff5555;font-size:0.8rem;">Failed to load.</div>'; }
        }

        async function loadMutedSessions() {
            const el = document.getElementById('muteList');
            try {
                const snap = await db.collection('mutedSessions').get();
                if (snap.empty) { el.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">No muted sessions.</div>'; return; }
                el.innerHTML = snap.docs.map(d => `<div class="ban-item"><span style="font-family:monospace;font-size:0.75rem;">${d.id}</span><button onclick="unmuteSession('${d.id}')" class="custom-btn" style="padding:4px 10px;font-size:0.75rem;">Unmute</button></div>`).join('');
            } catch (e) { el.innerHTML = '<div style="color:#ff5555;font-size:0.8rem;">Failed to load.</div>'; }
        }

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = str || '';
            return d.innerHTML;
        }

        async function loadReports() {
            const el = document.getElementById('reportsList');
            try {
                const snap = await db.collection('reports').orderBy('timestamp', 'desc').limit(20).get();
                if (snap.empty) { el.innerHTML = '<div style="color: var(--text-muted); font-size: 0.85rem;">No reports.</div>'; return; }
                el.innerHTML = snap.docs.map(d => {
                    const r = d.data();
                    const authorId = r.messageAuthorSessionId || '';
                    const banBtnHtml = authorId
                        ? `<button onclick="banAuthorAndDismiss('${authorId}', '${d.id}')" class="custom-btn red" style="padding:4px 10px;font-size:0.75rem;">Ban Author</button>`
                        : '';
                    return `<div class="ban-item" style="flex-direction:column;align-items:flex-start;gap:6px;">
                        <div style="font-size:0.8rem;"><strong>${escapeHtml(r.messageAuthor)}</strong>: ${escapeHtml(r.messageText)}</div>
                        <div style="display:flex;gap:8px;">
                            ${banBtnHtml}
                            <button onclick="dismissReport('${d.id}')" class="custom-btn" style="padding:4px 10px;font-size:0.75rem;">Dismiss</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) { el.innerHTML = '<div style="color:#ff5555;font-size:0.8rem;">Failed to load.</div>'; }
        }

        async function dismissReport(id) {
            try { await db.collection('reports').doc(id).delete(); loadReports(); }
            catch (e) { alert('Failed to dismiss: ' + e.message); }
        }

        async function banAuthorAndDismiss(authorId, reportId) {
            try {
                await db.collection('bannedSessions').doc(authorId).set({
                    bannedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                await db.collection('reports').doc(reportId).delete();
                loadBannedSessions();
                loadReports();
            } catch (e) { alert('Ban failed: ' + e.message); }
        }

        function resetBadges() {
            if (confirm('Reset ALL badge progress for ALL users?')) {
                localStorage.removeItem('doni_badges');
                alert('Your badges reset. Other users unaffected (badges are local).');
            }
        }

        function logoutAdmin() {
            firebase.auth().signOut();
        }
    </script>
    <script src="app-v35.js"></script>
    <script src="live-cursors.js"></script>
    <script src="commands-v2.js"></script>
    <script src="site-search.js"></script>
</body>
</html>
